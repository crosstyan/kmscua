[package]
name = "xcua"
version = "0.1.1"
edition.workspace = true
license.workspace = true
description = "kmscua's tools over X11: one unprivileged process that owns an Xvfb, captures it and drives it, for sandboxes with no DRM or uinput"

# The backend as a library too, so the integration tests drive it directly.
[lib]
name = "xcua"
path = "src/lib.rs"

[[bin]]
name = "xcua"
path = "src/main.rs"

[dependencies]
kmscua_mcp = { package = "cua", path = "../cua", default-features = false }
kmscua-proto = { path = "../proto" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
libc.workspace = true
fast_image_resize = { version = "5", features = ["rayon"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
x11rb = { version = "0.13", features = ["xtest", "xfixes", "shm", "randr"] }

[build-dependencies]
kmscua-buildinfo = { path = "../buildinfo" }
