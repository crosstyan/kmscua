[package]
name = "cuad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kmscua daemon: DRM/KMS scanout capture and uinput injection for agents, below the compositor"

[[bin]]
name = "cuad"
path = "src/main.rs"

[dependencies]
kmscua-proto = { path = "../proto" }
libdrmtap = { path = "../libdrmtap" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
libc.workspace = true
evdev = "0.13.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = { version = "5", features = ["rayon"] }

[features]
# Jetson (L4T) zero-copy recording: scanout dma-buf -> VIC -> NVENC, no
# GStreamer. Needs the Jetson Multimedia API headers and the L4T NvBufSurface
# and libv4l2 libraries at build time; falls back to GStreamer at run time
# when the scanout cannot be imported.
jetson = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }
