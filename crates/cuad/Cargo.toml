[package]
name = "cuad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kmscua daemon: DRM/KMS scanout capture and uinput injection for agents, below the compositor"

[[bin]]
name = "cuad"
path = "src/main.rs"

[dependencies]
kmscua-proto = { path = "../proto" }
libdrmtap = { path = "../libdrmtap" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
libc.workspace = true
evdev = "0.13.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
